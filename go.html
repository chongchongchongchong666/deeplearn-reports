<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📱 在线识别系统入口</title>
<style>
/* ============ 玻璃拟态移动端入口页（零依赖，兼容国内网络） ============ */
:root {
  --bg1: #0f172a; --bg2: #1e293b;
  --card: rgba(255,255,255,0.08); --card-border: rgba(255,255,255,0.15);
  --text: #f1f5f9; --muted: #94a3b8;
  --green: #34d399; --blue: #60a5fa; --red: #f87171;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, var(--bg1), var(--bg2));
  min-height: 100vh; color: var(--text);
  display: flex; flex-direction: column; align-items: center;
  padding: 32px 16px;
}
h1 { font-size: 22px; margin-bottom: 6px; }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; text-align: center; }
.card {
  width: 100%; max-width: 420px;
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 18px; padding: 22px 20px; margin-bottom: 18px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  text-decoration: none; color: var(--text);
  transition: transform .18s, border-color .18s;
}
.card:active { transform: scale(0.97); }
.card .icon { font-size: 40px; }
.card h2 { font-size: 19px; margin: 10px 0 6px; }
.card p { font-size: 13px; color: var(--muted); line-height: 1.6; }
.card .url {
  display: block; margin-top: 12px; font-size: 11px; color: var(--muted);
  word-break: break-all; background: rgba(0,0,0,0.25);
  border-radius: 8px; padding: 8px 10px;
}
.badge {
  display: inline-block; font-size: 11px; padding: 2px 10px;
  border-radius: 999px; margin-top: 10px;
}
.ok  { background: rgba(52,211,153,.18); color: var(--green); }
.bad { background: rgba(248,113,113,.18); color: var(--red); }
.refresh {
  margin-top: 8px; background: var(--card); color: var(--text);
  border: 1px solid var(--card-border); border-radius: 12px;
  padding: 12px 28px; font-size: 14px; cursor: pointer;
}
.hint { margin-top: 22px; font-size: 11px; color: var(--muted); text-align: center; line-height: 1.8; }
</style>
</head>
<body>
<h1>📱 在线识别系统</h1>
<div class="sub">点击卡片进入 · 网址由守护脚本自动更新</div>

<a class="card" id="card-face" href="#">
  <div class="icon">👤</div>
  <h2>人脸门禁系统</h2>
  <p>实时人脸识别 · 门禁台账 · 访客管理 · 陌生人告警 · 数据看板</p>
  <span class="badge ok" id="badge-face">⏳ 正在获取地址…</span>
  <span class="url" id="url-face">加载中…</span>
</a>

<a class="card" id="card-helmet" href="#">
  <div class="icon">🪖</div>
  <h2>头盔监管系统</h2>
  <p>骑手头盔检测 · 违规事件台账 · 实时监控 · 报表导出</p>
  <span class="badge ok" id="badge-helmet">⏳ 正在获取地址…</span>
  <span class="url" id="url-helmet">加载中…</span>
</a>

<button class="refresh" onclick="load()">🔄 刷新地址</button>

<div class="hint">
  ⚠️ 临时隧道网址会随电脑端服务重启而变化，<br>
  本入口页地址永久不变，收藏/打印二维码一次即可。
</div>

<script>
// ============ 核心逻辑：读取 tunnels.json 动态填充跳转地址 ============
// 守护脚本在隧道刷新后会自动更新 tunnels.json 并推送部署
async function load() {
  // 加时间戳参数绕过 CDN 缓存，确保拿到最新地址
  const r = await fetch('tunnels.json?t=' + Date.now(), { cache: 'no-store' });
  const data = await r.json();

  for (const [key, id] of [['face', 'face'], ['helmet', 'helmet']]) {
    const url = data[key];
    const card = document.getElementById('card-' + id);
    const badge = document.getElementById('badge-' + id);
    const urlEl = document.getElementById('url-' + id);
    if (url && url.startsWith('https://')) {
      card.href = url;
      badge.textContent = '🟢 在线 · 点击进入';
      badge.className = 'badge ok';
      urlEl.textContent = url;
    } else {
      card.href = '#';
      badge.textContent = '🔴 服务离线';
      badge.className = 'badge bad';
      urlEl.textContent = '电脑端服务未启动';
    }
  }

  // 支持 ?to=face / ?to=helmet 直接跳转（二维码可直达子系统）
  const to = new URLSearchParams(location.search).get('to');
  if (to && data[to] && data[to].startsWith('https://')) {
    location.href = data[to];
  }
}

load().catch(() => {
  document.querySelectorAll('.badge').forEach(b => {
    b.textContent = '⚠️ 地址获取失败';
    b.className = 'badge bad';
  });
});
</script>
</body>
</html>
